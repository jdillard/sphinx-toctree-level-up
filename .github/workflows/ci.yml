name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.sphinx-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        sphinx-version:
          - "sphinx>=7,<8"
          - "sphinx>=8,<9"
          - "sphinx>=9,<10"
        exclude:
          - python-version: "3.10"
            sphinx-version: "sphinx>=9,<10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "${{ matrix.sphinx-version }}"

      - name: Run tests
        run: python -m pytest

  docs:
    name: Docs (singlehtml)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build singlehtml (with :level-up:)
        run: python -m sphinx -W --keep-going -b singlehtml -d docs/_build/doctrees-with docs docs/_build/singlehtml

      - name: Build singlehtml (without :level-up:)
        run: |
          env LEVEL_UP_DEMO=0 python -m sphinx -W --keep-going -b singlehtml -d docs/_build/doctrees-without docs docs/_build/singlehtml/without-level-up
          mv docs/_build/singlehtml/without-level-up/index-without.html docs/_build/singlehtml/without-level-up/index.html

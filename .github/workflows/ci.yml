name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.sphinx-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        sphinx-version:
          - "sphinx>=7,<8"
          - "sphinx>=8,<9"
          - "sphinx>=9,<10"
        exclude:
          - python-version: "3.10"
            sphinx-version: "sphinx>=9,<10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "${{ matrix.sphinx-version }}"

      - name: Run tests
        run: python -m pytest

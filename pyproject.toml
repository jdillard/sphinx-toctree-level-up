[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sphinx-toctree-level-up"
description = "Backport of Sphinx toctree :level-up:"
authors = [
    {name = "Jared Dillard", email = "jared.dillard@gmail.com"},
]
classifiers = [
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "sphinx>=7.0",
]

[project.optional-dependencies]
docs = [
    "furo>=2025.12.19",
    "sphinx-gitref>=0.4.1",
]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Documentation = "https://sphinx-toctree-level-up.readthedocs.io/"
Homepage = "https://github.com/jdillard/sphinx-toctree-level-up"
Source = "https://github.com/jdillard/sphinx-toctree-level-up"
Issues = "https://github.com/jdillard/sphinx-toctree-level-up/issues"
Changelog = "https://github.com/jdillard/sphinx-toctree-level-up/blob/main/changelog.md"

[tool.setuptools]
packages = ["sphinx_toctree_level_up"]

[tool.setuptools.package-data]
sphinx_toctree_level_up = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "sphinx_toctree_level_up.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
